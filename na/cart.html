<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>North Active | Cart</title>
    <meta name="description" content="North Active cart page with persistent shopping bag behavior and source checkout redirect." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../NA/styles.css" />
  </head>
  <body data-page="cart">
    <div class="site-shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="North Active home">
          <span class="brand-mark">NA</span>
          <span class="brand-copy">
            <strong>North Active</strong>
            <small>Cart</small>
          </span>
        </a>

        <nav class="nav-links" aria-label="Primary navigation">
          <a href="./">Shop</a>
          <a href="./cart.html">Cart</a>
        </nav>

        <a class="bag-button" id="bagButton" href="./cart.html" aria-label="Shopping cart">
          <span>Bag</span>
          <span class="bag-count" id="bagCount">0</span>
        </a>
      </header>

      <main class="cart-page">
        <section class="cart-layout">
          <div class="cart-items-panel">
            <div class="section-heading simple-heading">
              <div>
                <p class="eyebrow">Shopping bag</p>
                <h1 class="cart-title">Your selected items</h1>
              </div>
            </div>
            <div id="cartItems"></div>
          </div>

          <aside class="cart-summary-panel" id="cartSummary"></aside>
        </section>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="../NA/store.js"></script>
    <script src="../NA/cart-page.js"></script>
  </body>
</html>
