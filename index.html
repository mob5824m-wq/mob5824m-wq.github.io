          <p><a href="https://github.com/mob5824m-wq/classroomlib" rel="noopener">View source</a></p>
        </article>
        <article class="card project noscript-card">
          <h3>Punishment Manager</h3>
          <p>A moderation bot for Discord: temporarily strips a member's roles,
             then restores them automatically when the timer runs out.</p>
          <p><a href="https://github.com/mob5824m-wq/Punishment-Manager" rel="noopener">View source</a></p>
        </article>
        <article class="card project noscript-card">

          <p><a href="https://github.com/mob5824m-wq/RaspAP-WebOne" rel="noopener">View source</a></p>
